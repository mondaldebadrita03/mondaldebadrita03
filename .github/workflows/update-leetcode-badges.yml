name: Update LeetCode Badges

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-badges:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v5

      - name: Update LeetCode badges
        env:
          LEETCODE_USERNAME: mondaldebadrita
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path
          from html import escape
          from urllib.parse import urljoin

          username = os.environ["LEETCODE_USERNAME"]
          api_url = f"https://leetcode-stats.tashif.codes/{username}/badges"

          request = urllib.request.Request(
              api_url,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
          except Exception as e:
              raise RuntimeError(f"Failed to fetch LeetCode badges: {e}")

          if payload.get("status") != "success":
              raise RuntimeError(f"LeetCode API returned an error: {payload}")

          data = payload.get("data", {})
          badges = data.get("list", [])

          if not badges:
              raise RuntimeError("No LeetCode badges were returned.")

          items = []

          for badge in badges:
              name = badge.get("name", "LeetCode Badge")
              icon = badge.get("icon")

              if not icon:
                  continue

              icon = urljoin("https://leetcode.com", icon)

              if not icon.startswith("https://"):
                  continue

              safe_name = escape(str(name), quote=True)
              safe_icon = escape(str(icon), quote=True)

              items.append(
                  f'<a href="https://leetcode.com/u/{username}/" '
                  f'title="{safe_name}">'
                  f'<img src="{safe_icon}" '
                  f'alt="{safe_name}" width="90"/></a>'
              )

          if not items:
              raise RuntimeError("No usable LeetCode badge icons were found.")

          badge_html = (
              '<p align="center">\n'
              + " ".join(items)
              + '\n</p>'
          )

          readme_path = Path("README.md")

          if not readme_path.exists():
              raise RuntimeError("README.md was not found.")

          text = readme_path.read_text(encoding="utf-8")

          start = "<!-- LEETCODE-BADGES:START -->"
          end = "<!-- LEETCODE-BADGES:END -->"

          if start not in text:
              raise RuntimeError(
                  "README.md is missing LEETCODE-BADGES:START"
              )

          if end not in text:
              raise RuntimeError(
                  "README.md is missing LEETCODE-BADGES:END"
              )

          before, remainder = text.split(start, 1)
          _, after = remainder.split(end, 1)

          updated = (
              before
              + start
              + "\n"
              + badge_html
              + "\n"
              + end
              + after
          )

          readme_path.write_text(updated, encoding="utf-8")

          print(f"Successfully updated {len(items)} LeetCode badges.")
          PY

      - name: Commit updated badges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No badge changes detected."
          else
            git commit -m "chore: update LeetCode badges"
            git push
          fi
